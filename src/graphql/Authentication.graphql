mutation BeginCredentialLogin($input: BeginCredentialLoginInput!) {
  beginCredentialLogin(input: $input) {
    challengeId
    maskedEmail
    expiresAt
    resendAvailableAt
  }
}

mutation ResendCredentialLoginCode($input: ResendCredentialLoginCodeInput!) {
  resendCredentialLoginCode(input: $input) {
    challengeId
    maskedEmail
    expiresAt
    resendAvailableAt
  }
}

mutation VerifyCredentialLogin($input: VerifyCredentialLoginInput!) {
  verifyCredentialLogin(input: $input) {
    accessToken
    expiresInSeconds
    refreshToken
    refreshExpiresAt
    user {
      id
      displayName
      role
    }
  }
}

mutation RefreshCredentialSession($input: RefreshCredentialSessionInput!) {
  refreshCredentialSession(input: $input) {
    accessToken
    expiresInSeconds
    refreshToken
    refreshExpiresAt
    user {
      id
      displayName
      role
    }
  }
}

mutation RevokeCredentialSession($input: RevokeCredentialSessionInput!) {
  revokeCredentialSession(input: $input)
}

mutation AdminProvisionUser($input: AdminProvisionUserInput!) {
  adminProvisionUser(input: $input) {
    user {
      id
      displayName
      role
    }
  }
}
