query AdminOperationalOverview {
  adminOperationalOverview {
    activeGroups
    activeUsers
    pendingIntakes
    pendingMedia
    unreadNotifications
  }
  adminAcademicOverview {
    activeStudentCount
    activeTeacherCount
    assignedTestCount
    completionPercentage
  }
}

query AdminContactRequests($after: String, $first: Int) {
  adminContactRequests(after: $after, first: $first) {
    edges {
      node {
        id
        name
        kind
        status
        createdAt
        email
        phone
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

