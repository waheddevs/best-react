query AdminOperationalOverview {
  adminOperationalOverview {
    activeGroups
    pendingIntakes
    unreadNotifications
  }
}

query AdminContactRequests($after: String, $first: Int) {
  adminContactRequests(after: $after, first: $first) {
    edges {
      node {
        id
        name
        kind
        status
        createdAt
        email
        phone
        subject
        message
        reviewNote
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation AdminUpdateMessageStatus($input: SetIntakeStatusInput!) {
  adminSetContactRequestStatus(input: $input) {
    intake {
      id
      name
      kind
      status
      createdAt
      email
      phone
      subject
      message
      reviewNote
    }
  }
}

mutation AdminRemoveMessage($input: AdminRemoveMessageInput!) {
  adminRemoveMessage(input: $input)
}

mutation AdminRemoveMessage($input: AdminRemoveMessageInput!) {
  adminRemoveMessage(input: $input)
}

