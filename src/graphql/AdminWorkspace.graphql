query AdminProfile {
  myProfile {
    id
    displayName
    email
    branchName
    phone
    preferredLanguage
    avatarMediaObjectId
    status
    role
  }
}

mutation AdminUpdateProfile($input: UpdateMyProfileInput!) {
  updateMyProfile(input: $input) {
    profile {
      displayName
      email
      phone
      preferredLanguage
      avatarMediaObjectId
    }
  }
}
