query StudentSettingsProfile {
  myProfile {
    displayName
    email
    phone
    preferredLanguage
    avatarMediaObjectId
  }
}

mutation StudentProfileAvatarDownloadIntent($input: MediaObjectReferenceInput!) {
  createMediaDownloadIntent(input: $input) {
    downloadIntent {
      url
    }
  }
}

mutation StudentUpdateSettingsProfile($input: UpdateMyProfileInput!) {
  updateMyProfile(input: $input) {
    profile {
      displayName
      email
      phone
      preferredLanguage
      avatarMediaObjectId
    }
  }
}

mutation StudentChangePassword($input: ChangeMyPasswordInput!) {
  changeMyPassword(input: $input) {
    changed
  }
}

mutation StudentProfileUploadIntent($input: CreateMediaUploadIntentInput!) {
  createMediaUploadIntent(input: $input) {
    uploadIntent {
      mediaObjectId
      method
      url
      requiredHeaders {
        name
        value
      }
    }
  }
}

mutation StudentConfirmProfileUpload($input: MediaObjectReferenceInput!) {
  confirmMediaUpload(input: $input) {
    mediaObject {
      id
      mediaType
      status
      malwareStatus
    }
  }
}
