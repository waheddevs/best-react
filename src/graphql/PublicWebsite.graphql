query PublicCourses($language: Language!, $first: Int = 50) {
  publicCourses(language: $language, first: $first) {
    edges {
      node {
        id
        slug
        language
        status
        category
        accent
        symbol
        featured
        position
        heroVariant
        imagePath
        coverMediaId
        posterImagePath
        title
        description
        audience
        comparisonTitle
        duration
        focus
        formatLabel
        imageAlt
        level
        posterAlt
        posterTitle
        prerequisites
        schedule
        overview
        highlights
        outcomes
        curriculum
        tracks {
          position
          title
          level
          summary
          highlights
        }
      }
    }
  }
}

query PublicCourse($language: Language!, $slug: String!) {
  publicCourse(language: $language, slug: $slug) {
    id
    slug
    language
    status
    category
    accent
    symbol
    featured
    position
    heroVariant
    imagePath
    coverMediaId
    posterImagePath
    title
    description
    audience
    comparisonTitle
    duration
    focus
    formatLabel
    imageAlt
    level
    posterAlt
    posterTitle
    prerequisites
    schedule
    overview
    highlights
    outcomes
    curriculum
    tracks {
      position
      title
      level
      summary
      highlights
    }
  }
}

query PublicEvents($language: Language!, $first: Int = 50) {
  publicEvents(language: $language, first: $first) {
    edges {
      node {
        id
        slug
        language
        status
        timelineStatus
        position
        startsAt
        endsAt
        capacity
        location
        imagePath
        title
        coverMediaId
        description
        imageAlt
        formatLabel
        dateLabel
        timeLabel
        durationLabel
        locationLabel
        topics
        overview
        audience
        takeaways
        practicalInfo
        programme {
          position
          timeLabel
          title
          description
        }
        faq {
          position
          question
          answer
        }
      }
    }
  }
}

query PublicEvent($language: Language!, $slug: String!) {
  publicEvent(language: $language, slug: $slug) {
