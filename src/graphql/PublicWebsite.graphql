query PublicFaq($language: Language!) {
  publicFaq(language: $language) {
    id
    key
    category
    position
    question
    answer
  }
}

query PublicExamOfferings($language: Language!) {
  publicExamOfferings(language: $language) {
    id
    key
    position
    title
    description
    level
    duration
    formatLabel
    highlights
    sessions {
      id
      startsAt
      capacity
      availablePlaces
    }
  }
}

query PublicResultVideos($language: Language!) {
  publicResultVideos(language: $language) {
    id
    key
    position
    title
    duration
    videoPath
    posterPath
    source {
      provider
      creator
      url
      licenseUrl
    }
  }
}

mutation RegisterForCourse($input: RegisterForCourseInput!) {
  registerForCourse(input: $input) {
    accepted
    receiptId
  }
}

mutation RegisterForEvent($input: RegisterForEventInput!) {
  registerForEvent(input: $input) {
    accepted
    receiptId
  }
}

mutation SubmitExamRegistration($input: SubmitExamRegistrationInput!) {
  submitExamRegistration(input: $input) {
    accepted
    receiptId
  }
}

mutation SubmitContactRequest($input: SubmitContactRequestInput!) {
  submitContactRequest(input: $input) {
    accepted
    receiptId
  }
}
