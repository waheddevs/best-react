query AdminContentCatalog(
  $input: AdminDirectoryInput!
  $courses: Boolean!
  $events: Boolean!
  $exams: Boolean!
) {
  adminCourseCatalog(input: $input) @include(if: $courses) {
    page
    pageCount
    totalCount
    metrics {
      key
      value
    }
    nodes {
      id
      updatedAt
      registrations
      versions {
        id
        slug
        language
        status
        category
        accent
        symbol
        featured
        position
        heroVariant
        imagePath
        coverMediaId
        posterImagePath
        title
        description
        audience
        comparisonTitle
        duration
        focus
        formatLabel
        imageAlt
        level
        posterAlt
        posterTitle
        prerequisites
        schedule
        overview
        highlights
        outcomes
        curriculum
        tracks {
          title
          summary
          level
          highlights
        }
      }
    }
  }
  adminEventCatalog(input: $input) @include(if: $events) {
    page
    pageCount
    totalCount
    metrics {
      key
      value
    }
    nodes {
      id
      updatedAt
      registrations
      versions {
        id
        slug
        language
        status
        timelineStatus
        position
        coverMediaId
        imagePath
        startsAt
        endsAt
        location
        capacity
        title
        description
        imageAlt
        formatLabel
        dateLabel
        timeLabel
        durationLabel
        locationLabel
        topics
        overview
        audience
        takeaways
        practicalInfo
        programme {
          timeLabel
          title
          description
        }
        faq {
          question
          answer
        }
      }
    }
  }
  adminExamCatalog(input: $input) @include(if: $exams) {
    page
    pageCount
    totalCount
    metrics {
      key
      value
    }
    nodes {
      id
      key
      revision
      position
      status
      registrations
      translations {
        language
        title
        description
        formatLabel
        duration
        level
        highlights
      }
      sessions {
        id
        offeringId
        revision
        startsAt
        capacity
        active
        registrations
      }
    }
  }
}
mutation AdminRemoveCourse($input: AdminRemoveCourseInput!) {
  adminRemoveCourse(input: $input)
}
mutation AdminSaveCourseContent($input: AdminSaveCourseContentInput!) {
  adminSaveCourseContent(input: $input)
}
mutation AdminSaveEventContent($input: AdminSaveEventContentInput!) {
  adminSaveEventContent(input: $input)
}
mutation AdminContentCourseStatus($input: SetPublicCourseStatusInput!) {
  setCourseStatus(input: $input) {
    course {
      id
      status
    }
  }
}
mutation AdminContentEventStatus($input: SetPublicEventStatusInput!) {
  setEventStatus(input: $input) {
    event {
      id
      status
    }
  }
}
mutation AdminSaveExam($input: AdminSaveExamInput!) {
  adminSaveExam(input: $input)
}
mutation AdminRemoveExam($input: AdminRemoveExamInput!) {
  adminRemoveExam(input: $input)
}
mutation AdminRemoveExam($input: AdminRemoveExamInput!) {
  adminRemoveExam(input: $input)
}
mutation AdminSaveExamSession($input: AdminSaveExamSessionInput!) {
  adminSaveExamSession(input: $input)
}
query AdminExamSessionDirectory($input: AdminDirectoryInput!, $language: Language!) {
  adminExamSessionDirectory(input: $input, language: $language) {
    page
    pageCount
    totalCount
    metrics {
      key
      value
    }
    offerings {
      id
      label
    }
    nodes {
      id
      offeringId
      revision
      title
      startsAt
      capacity
      active
      registrations
    }
  }
}

