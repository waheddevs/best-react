query AdminPublicContentDetail(
  $slug: String!
  $language: Language!
  $course: Boolean!
  $event: Boolean!
) {
  adminCourse(slug: $slug, language: $language) @include(if: $course) {
    id
    slug
    title
    description
    status
    category
    accent
    symbol
    featured
    position
    heroVariant
    imagePath
    coverMediaId
    posterImagePath
    audience
    comparisonTitle
    duration
    focus
    formatLabel
    imageAlt
    level
    posterAlt
    posterTitle
    prerequisites
    schedule
    overview
    highlights
    outcomes
    curriculum
    tracks {
      title
      summary
      level
      highlights
    }
  }
  adminEvent(slug: $slug, language: $language) @include(if: $event) {
    id
    slug
    title
    description
    status
    timelineStatus
    position
    imagePath
    startsAt
    endsAt
    location
    capacity
    imageAlt
    formatLabel
    dateLabel
    timeLabel
    durationLabel
    locationLabel
    topics
    overview
    audience
    takeaways
    practicalInfo
    programme {
      timeLabel
      title
      description
    }
    faq {
      question
      answer
    }
  }
}

mutation AdminRemoveEvent($input: AdminRemoveEventInput!) {
