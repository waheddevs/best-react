query TeacherStudentAttempts($groupId: ID!, $studentId: ID!, $language: Language!) {
  teacherStudentAttempts(groupId: $groupId, studentId: $studentId, language: $language, first: 50) {
    edges {
      node {
        attemptId
        testId
        title
        skill
        attemptNumber
        status
        submittedAt
        percentage
      }
    }
  }
}

query TeacherSpeakingAttemptReview($attemptId: ID!, $language: Language!) {
  teacherSpeakingAttemptReview(attemptId: $attemptId, language: $language) {
    attemptId
    studentDisplayName
    title
    status
    answers {
      questionId
      position
      sectionPosition
      prompt
      audioUrl
      audioUrlExpiresAt
    }
    review {
      fluencyCoherence
      lexicalResource
      grammaticalRangeAccuracy
      pronunciation
      practiceBand
      feedback
      reviewedAt
      releasedAt
    }
  }
}

mutation TeacherSaveSpeakingAttemptReview(
  $input: SaveSpeakingAttemptReviewInput!
  $language: Language!
) {
  saveSpeakingAttemptReview(input: $input, language: $language) {
    attemptId
    status
    review {
      practiceBand
      releasedAt
    }
  }
}

