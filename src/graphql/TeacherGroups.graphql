query TeacherObjectivePractice($testVersionId: ID!) {
  teacherTestVersion(testVersionId: $testVersionId) {
    id
    durationMinutes
    primaryLanguage
    publishedAt
    status
    translations {
      language
      title
      description
    }
    sections {
      id
      position
      mediaObjectId
