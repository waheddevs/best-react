query TeacherGroups($first: Int, $after: String) {
  teacherGroups(first: $first, after: $after, status: ACTIVE) {
    edges {
      node {
        id
        createdAt
        name
        slug
        category
        room
        scheduleDays
        startsAtMinutes
        endsAtMinutes
        activeStudentCount
        monthlyTuitionUzs
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query TeacherGroup($groupId: ID!) {
  teacherGroup(groupId: $groupId) {
    id
    name
    slug
    category
    room
    scheduleDays
    startsAtMinutes
    endsAtMinutes
    activeStudentCount
    monthlyTuitionUzs
  }
}

query TeacherGroupOverviewData($groupId: ID!) {
  teacherGroupOverview(groupId: $groupId) {
    activeAssignmentCount
    scheduledTestCount
    materialCount
    currentStudentCount
  }
  teacherGroupRosterSummary(groupId: $groupId) {
    currentTotal
    historicalTotal
    active
    paused
    debtors
    departed
  }
}

query TeacherGroupRosterData($groupId: ID!, $first: Int, $after: String) {
  teacherGroupRosterSummary(groupId: $groupId) {
    currentTotal
    historicalTotal
    active
    paused
    debtors
    departed
  }
  teacherGroupRoster(groupId: $groupId, first: $first, after: $after, includeEnded: true) {
    edges {
      node {
        membershipId
        studentId
        displayName
        phone
        rosterStatus
        outstandingBalanceUzs
        paidAmountUzs
        startedAt
        endedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation TeacherCreateGroup($input: CreateTeacherGroupInput!) {
  createTeacherGroup(input: $input) {
    group {
      id
      name
      category
    }
  }
}

mutation TeacherUpdateGroup($input: UpdateTeacherGroupInput!) {
  updateTeacherGroup(input: $input) {
    group {
      id
      name
      slug
      category
      room
      scheduleDays
      startsAtMinutes
      endsAtMinutes
      activeStudentCount
      monthlyTuitionUzs
    }
  }
}

mutation TeacherDeleteGroup($groupId: ID!) {
  deleteTeacherGroup(groupId: $groupId) {
    group {
      id
      status
    }
  }
}

mutation TeacherCreateStudentInGroup($input: TeacherCreateStudentInGroupInput!) {
  teacherCreateStudentInGroup(input: $input) {
    membership {
      membershipId
      studentId
      displayName
      rosterStatus
    }
  }
}
