query TeacherGroups($first: Int, $after: String) {
  teacherGroups(first: $first, after: $after, status: ACTIVE) {
    edges {
      node {
        id
        createdAt
        name
        slug
        category
        room
        scheduleDays
        startsAtMinutes
        endsAtMinutes
        activeStudentCount
        monthlyTuitionUzs
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query TeacherGroup($groupId: ID!) {
  teacherGroup(groupId: $groupId) {
    id
    name
    slug
    category
    room
    scheduleDays
    startsAtMinutes
    endsAtMinutes
    activeStudentCount
    monthlyTuitionUzs
  }
}

query TeacherGroupOverviewData($groupId: ID!) {
  teacherGroupOverview(groupId: $groupId) {
    activeAssignmentCount
    scheduledTestCount
    materialCount
    currentStudentCount
  }
  teacherGroupRosterSummary(groupId: $groupId) {
    currentTotal
    historicalTotal
    active
    paused
    debtors
    departed
  }
}

query TeacherGroupRosterData($groupId: ID!, $first: Int, $after: String) {
  teacherGroupRosterSummary(groupId: $groupId) {
    currentTotal
    historicalTotal
    active
    paused
    debtors
    departed
  }
  teacherGroupRoster(groupId: $groupId, first: $first, after: $after, includeEnded: true) {
    edges {
      node {
        membershipId
        studentId
        displayName
        email
        phone
        rosterStatus
        outstandingBalanceUzs
        paidAmountUzs
        recentPayments {
          id
          amountUzs
          paidAt
        }
        startedAt
        endedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query TeacherGroupTestPapers($groupId: ID!, $page: Int! = 1) {
  teacherTestPapers(groupId: $groupId, page: $page) {
    items {
      id
      practiceNumber
      slug
      academicYear
      createdAt
      completedStudentCount
      title
      sourceLabel
      skills {
        testId
        testVersionId
        skill
        title
        description
        durationMinutes
        questionCount
        status
      }
    }
    pageInfo {
      currentPage
      pageSize
      totalItems
      totalPages
      hasNextPage
      hasPreviousPage
    }
  }
}

query TeacherPracticeTest($groupId: ID!, $practiceNumber: Int!) {
  teacherTestPaper(groupId: $groupId, practiceNumber: $practiceNumber) {
    id
    practiceNumber
    slug
    academicYear
    createdAt
    completedStudentCount
    title
    sourceLabel
    skills {
      testId
      testVersionId
      skill
      title
      description
      durationMinutes
      questionCount
      status
    }
  }
}

mutation TeacherCreatePracticeTest($input: CreateTeacherPracticeTestInput!) {
  createTeacherPracticeTest(input: $input) {
    testPaper {
      id
      practiceNumber
    }
  }
}

mutation TeacherDeletePracticeTest($testPaperId: ID!) {
  deleteTeacherPracticeTest(testPaperId: $testPaperId) {
    testPaperId
    status
    deletedSkillCount
  }
}

query TeacherSpeakingPractice($testVersionId: ID!) {
  teacherTestVersion(testVersionId: $testVersionId) {
    id
    durationMinutes
    primaryLanguage
    publishedAt
    status
    translations {
      language
      title
      description
    }
    questions {
      id
      position
      sectionPosition
      translations {
        language
        prompt
      }
    }
  }
}

