query StudentTestPapers($first: Int, $after: String) {
  studentTestPapers(first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        isSaved
        slug
        academicYear
        title
        sourceLabel
        skills {
          testId
          testVersionId
          skill
          title
          description
          durationMinutes
          questionCount
          attemptId
          attemptStatus
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query StudentTestPaper($paperId: ID!) {
  studentTestPaper(paperId: $paperId) {
    id
    isSaved
    slug
    academicYear
    title
    sourceLabel
    skills {
      testId
      testVersionId
      skill
      title
      description
      durationMinutes
      questionCount
      attemptId
      attemptStatus
    }
  }
}

mutation StartStudentTestAttempt($input: StartTestAttemptInput!) {
  startTestAttempt(input: $input) {
    attempt {
      ...StudentAttemptFields
    }
  }
}

query StudentTestAttempt($attemptId: ID!) {
  studentAttempt(attemptId: $attemptId, language: EN) {
    ...StudentAttemptFields
  }
}

query StudentAttemptMediaDownload($attemptId: ID!, $mediaObjectId: ID!) {
  studentAttemptMediaDownload(attemptId: $attemptId, mediaObjectId: $mediaObjectId) {
    url
    expiresAt
  }
}

query StudentReleasedAttemptResult($attemptId: ID!) {
  studentReleasedAttemptResult(attemptId: $attemptId) {
    attemptId
    testId
    title
    skill
    correctAnswerCount
    totalQuestionCount
    percentage
    sections {
      id
      position
      title
      content
    }
    answers {
      questionId
      sectionId
      position
      prompt
      studentAnswer
      correctAnswer
      isCorrect
      evidenceStartOffset
      evidenceEndOffset
    }
  }
}

query StudentSpeakingResult($attemptId: ID!) {
  studentSpeakingResult(attemptId: $attemptId, language: EN) {
    attemptId
    title
    fluencyCoherence
    lexicalResource
    grammaticalRangeAccuracy
    pronunciation
    practiceBand
    feedback
    releasedAt
  }
}

query StudentResults($first: Int, $after: String) {
  studentResults(first: $first, after: $after, language: EN) {
    edges {
      cursor
      node {
        attemptId
        testId
        title
        skill
        attemptNumber
        correctAnswerCount
        totalQuestionCount
        percentage
        practiceBand
        highestPercentage
        passed
        submittedAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation SaveStudentTestAnswer($input: SaveAttemptAnswerInput!) {
  saveAttemptAnswer(input: $input, language: EN) {
    attempt {
      id
      status
      serverTime
      answers {
        questionId
        selectedOptionId
        selectedOptionIds
        textValue
        responseMediaObjectId
        savedAt
      }
    }
  }
}

mutation SaveStudentAttemptNote($input: SaveAttemptSectionNoteInput!) {
  saveAttemptSectionNote(input: $input, language: EN) {
    attempt {
      id
      notes {
        sectionId
        text
        savedAt
      }
    }
  }
}

mutation CreateStudentAttemptAudioUpload($input: CreateAttemptAudioUploadInput!) {
  createAttemptAudioUploadIntent(input: $input) {
    uploadIntent {
      mediaObjectId
      method
      url
      requiredHeaders {
        name
        value
      }
      sizeBytes
      expiresAt
    }
  }
}

mutation ConfirmStudentAttemptAudioUpload($input: ConfirmAttemptAudioUploadInput!) {
  confirmAttemptAudioUpload(input: $input) {
    mediaObject {
      id
      mediaType
      status
      malwareStatus
    }
  }
}

mutation SubmitStudentTestAttempt($input: SubmitTestAttemptInput!) {
  submitTestAttempt(input: $input, language: EN) {
    attempt {
      ...StudentAttemptFields
    }
  }
}

fragment StudentAttemptFields on StudentAttempt {
  id
  testId
  testVersionId
  title
  skill
  status
  attemptNumber
  startedAt
  expiresAt
  submittedAt
  serverTime
  sections {
    id
    position
    title
    instructions
    content
    mediaObjectId
    blocks {
      id
      position
      kind
      caption
      tableHeaderRows {
        cells
      }
      tableRows {
        cells
      }
      questionIds
    }
  }
  questions {
    id
    sectionId
    kind
    position
    prompt
    answerLimit
    maxSelections
    options {
      id
      position
      text
    }
  }
  answers {
    questionId
    selectedOptionId
    selectedOptionIds
    textValue
    responseMediaObjectId
    savedAt
  }
  notes {
    sectionId
    text
    savedAt
  }
  result {
    correctAnswerCount
    totalQuestionCount
    percentage
    passed
  }
}
